name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Build
        run: npm run build

      - name: Start local app for leaderboard smoke
        run: |
          MONITORING_DATABASE_URL= POSTGRES_URL= DATABASE_URL= \
          MONITORING_MANUAL_RUN_ENABLED=true \
          MONITORING_MANUAL_TOKEN=ci-token \
          CRON_SECRET=ci-cron \
          npm run dev > /tmp/model-tracker-next.log 2>&1 &
          echo $! > /tmp/model-tracker-next.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:4000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/model-tracker-next.log
          exit 1

      - name: Backfill local leaderboard
        run: |
          curl -fsS --max-time 180 \
            -X POST 'http://localhost:4000/api/monitoring/run?lane=leaderboard' \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            --data '{"lanes":["leaderboard"],"timeoutMs":12000}'

      - name: Leaderboard smoke
        run: npm run smoke:leaderboard

      - name: Stop local app
        if: always()
        run: |
          if [ -f /tmp/model-tracker-next.pid ]; then
            kill "$(cat /tmp/model-tracker-next.pid)" || true
          fi
